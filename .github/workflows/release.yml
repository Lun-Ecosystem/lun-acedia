# Publishes the amd64 image to GHCR when CrOliX publishes a release on main (tag vX.Y.Z, the
# version of server/package.json). A server pulls it by its version.
name: Release image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./server/package.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match server/package.json version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lun-ecosystem/lun-acedia:${{ env.VERSION }}
            ghcr.io/lun-ecosystem/lun-acedia:latest
